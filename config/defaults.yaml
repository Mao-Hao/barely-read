# BR User Configuration — Default Values
# Copy to config/user.yaml and customize.
# Generated by /br-init skill.

# --- Research Profile ---
research:
  # Primary research area (free text)
  area: ""
  # Specific topics of interest
  topics: []
  # Keywords for search and relevance ranking
  keywords: []
  # Current research stage
  stage: "phd"  # undergrad | masters | phd | postdoc | faculty | industry

# --- Explanation Preferences ---
explanation:
  # How detailed should explanations be?
  depth: "detailed"  # brief | standard | detailed
  # Include mathematical formulations?
  include_math: true
  # Assumed knowledge level
  level: "graduate"  # undergraduate | graduate | expert
  # Preferred language for explanations
  language: "en"  # en | zh | mixed

# --- Output Preferences ---
output:
  # Max words for paper summaries
  summary_max_words: 500
  # Note language
  note_language: "en"  # zh | en | mixed
  # Include BibTeX in notes?
  include_bibtex: true

# --- Search Preferences ---
search:
  # Prefer recent papers?
  prefer_recent: true
  # Default date range (years back from now)
  default_years_back: 3
  # Max results per search
  max_results: 20
